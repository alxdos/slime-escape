<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slime Escape - Vibe Jam 2026</title>
    <script async src="https://vibej.am/2026/widget.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --open-ease: cubic-bezier(0.17, 0.84, 0.24, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0c10;
      }

      #scene {
        display: block;
      }

      .portal-eye {
        position: fixed;
        inset: 0;
        z-index: 1000;
        isolation: isolate;
        cursor: pointer;
        background: transparent;
        transition: opacity 220ms ease;
      }

      .world {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(circle at 50% 52%, rgba(0, 0, 0, 0.14) 0 34%, rgba(0, 0, 0, 0.48) 62%, rgba(0, 0, 0, 0.82) 100%);
        backdrop-filter: blur(18px) brightness(0.72) saturate(0.9);
        animation: focus-search 5.8s ease-in-out infinite;
        transition:
          opacity 1000ms ease,
          backdrop-filter 1200ms ease;
        will-change: opacity, backdrop-filter;
      }

      .eye {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .eye::before {
        content: "";
        position: absolute;
        inset: -12vmax;
        z-index: 5;
        background: radial-gradient(ellipse at 50% 50%, transparent 0 24%, rgba(0, 0, 0, 0.68) 48%, #000 80%);
        opacity: 0.86;
        mix-blend-mode: multiply;
        animation: pupil-haze 5.8s ease-in-out infinite;
        transition: opacity 900ms ease;
      }

      .lid-track {
        position: absolute;
        left: -10vw;
        width: 120vw;
        height: 55vh;
        z-index: 4;
        will-change: transform;
        transform: translateY(0);
        transition: transform 1250ms var(--open-ease);
      }

      .lid {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.035), transparent 39%),
          linear-gradient(180deg, #060606 0%, #000 68%);
        will-change: transform;
        transform: translateY(0);
      }

      .lid::after {
        content: "";
        position: absolute;
        left: -4vw;
        width: 128vw;
        height: 13vh;
        background: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.92) 38%, rgba(0, 0, 0, 0));
        filter: blur(10px);
        opacity: 0.92;
      }

      .lid-top {
        top: 0;
        border-radius: 0 0 50% 50% / 0 0 8% 8%;
        animation: top-lid-struggle 7.2s ease-in-out infinite;
      }

      .lid-track-top {
        top: 0;
      }

      .lid-top::after {
        bottom: -7vh;
      }

      .lid-bottom {
        bottom: 0;
        border-radius: 50% 50% 0 0 / 8% 8% 0 0;
        background:
          radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.028), transparent 41%),
          linear-gradient(0deg, #050505 0%, #000 68%);
        animation: bottom-lid-struggle 7.2s ease-in-out infinite;
      }

      .lid-track-bottom {
        bottom: 0;
      }

      .lid-bottom::after {
        top: -7vh;
        transform: rotate(180deg);
      }

      .lashes {
        position: absolute;
        inset: 0;
        z-index: 6;
        opacity: 0.4;
        background:
          linear-gradient(92deg, transparent 0 11%, rgba(0, 0, 0, 0.52) 11.5% 12%, transparent 12.4%),
          linear-gradient(87deg, transparent 0 29%, rgba(0, 0, 0, 0.38) 29.4% 29.9%, transparent 30.3%),
          linear-gradient(94deg, transparent 0 48%, rgba(0, 0, 0, 0.45) 48.4% 48.8%, transparent 49.2%),
          linear-gradient(86deg, transparent 0 67%, rgba(0, 0, 0, 0.35) 67.4% 67.9%, transparent 68.3%),
          linear-gradient(91deg, transparent 0 85%, rgba(0, 0, 0, 0.46) 85.4% 85.9%, transparent 86.3%);
        filter: blur(7px);
        mix-blend-mode: multiply;
        pointer-events: none;
        transition: opacity 700ms ease;
      }

      .portal-opening .world,
      .portal-awake .world {
        opacity: 0;
        backdrop-filter: blur(0) brightness(1) saturate(1);
        animation: none;
      }

      .portal-awake .portal-eye {
        opacity: 0;
        pointer-events: none;
      }

      .portal-opening .eye::before,
      .portal-opening .lashes,
      .portal-awake .eye::before,
      .portal-awake .lashes {
        opacity: 0;
        animation: none;
      }

      .portal-opening .lid {
        animation: none;
        transform: translateY(0);
      }

      .portal-opening .lid-track-top {
        transform: translateY(-72vh);
      }

      .portal-opening .lid-track-bottom {
        transform: translateY(72vh);
      }

      @keyframes top-lid-struggle {
        0%,
        34%,
        46%,
        72%,
        100% {
          transform: translateY(0);
        }

        6% {
          transform: translateY(0);
        }

        16% {
          transform: translateY(-16vh);
        }

        26% {
          transform: translateY(-10.2vh);
        }

        51% {
          transform: translateY(-13.6vh);
        }

        57% {
          transform: translateY(-10.4vh);
        }

        68% {
          transform: translateY(-3.8vh);
        }
      }

      @keyframes bottom-lid-struggle {
        0%,
        34%,
        46%,
        72%,
        100% {
          transform: translateY(0);
        }

        6% {
          transform: translateY(0);
        }

        16% {
          transform: translateY(14.2vh);
        }

        26% {
          transform: translateY(8.9vh);
        }

        51% {
          transform: translateY(11.8vh);
        }

        57% {
          transform: translateY(8.1vh);
        }

        68% {
          transform: translateY(3.3vh);
        }
      }

      @keyframes focus-search {
        0%,
        16%,
        100% {
          backdrop-filter: blur(20px) brightness(0.58) saturate(0.82);
        }

        21% {
          backdrop-filter: blur(10px) brightness(0.76) saturate(0.95);
        }

        27% {
          backdrop-filter: blur(24px) brightness(0.54) saturate(0.78);
        }

        51% {
          backdrop-filter: blur(9px) brightness(0.84) saturate(0.96);
        }

        60% {
          backdrop-filter: blur(18px) brightness(0.66) saturate(0.86);
        }
      }

      @keyframes pupil-haze {
        0%,
        32%,
        100% {
          opacity: 0.96;
        }

        20%,
        51% {
          opacity: 0.82;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .world,
        .lid,
        .eye::before {
          animation-duration: 9s;
        }

        .portal-opening .lid-track,
        .portal-awake .world {
          transition-duration: 400ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
    </div>

    <main class="portal-eye" aria-label="Portal eye opening prototype">
      <div class="world" aria-hidden="true"></div>
      <div class="eye" aria-hidden="true">
        <div class="lid-track lid-track-top">
          <div class="lid lid-top"></div>
        </div>
        <div class="lid-track lid-track-bottom">
          <div class="lid lid-bottom"></div>
        </div>
        <div class="lashes"></div>
      </div>
    </main>

    <script>
      let wakeStarted = false;
      const wakeUp = () => {
        if (wakeStarted) {
          return;
        }
        wakeStarted = true;
        document.body.classList.add("portal-opening");
        window.setTimeout(() => {
          document.body.classList.add("portal-awake");
        }, 1250);
      };

      const isStartupFinished = () => {
        const startup = document.querySelector('[data-role="startup-overlay"]');
        return startup instanceof HTMLElement && startup.style.display === "none";
      };

      const wakeWhenGameIsReady = () => {
        if (isStartupFinished()) {
          wakeUp();
        }
      };

      window.portalEyeReady = wakeUp;
      window.addEventListener("portal:ready", wakeUp);
      window.addEventListener("pointerdown", wakeUp, { once: true });
      window.addEventListener(
        "keydown",
        (event) => {
          if (event.key === " " || event.key === "Enter" || event.key.toLowerCase() === "o") {
            wakeUp();
          }
        },
        { once: true },
      );

      new MutationObserver(wakeWhenGameIsReady).observe(document.body, {
        attributes: true,
        attributeFilter: ["style"],
        childList: true,
        subtree: true,
      });

      window.SLIME_ESCAPE_AUTO_START = "portal";
      window.SLIME_ESCAPE_LOADING_IMAGE_SRC = "/images/slime-escape-portal.jpg";
    </script>
    <script type="module" src="/src/main/index.ts"></script>
  </body>
</html>
